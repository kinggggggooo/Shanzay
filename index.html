<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b1c">
<title>For Shanzay ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 18px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #29205b, transparent 55%),
    linear-gradient(135deg, #090b1c, #17102c, #071b32);
  overflow-x: hidden;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#9baaff 1px, transparent 1px);
  background-size: 65px 65px, 100px 100px;
  background-position: 0 0, 30px 40px;
  opacity: .35;
  animation: sparkle 5s ease-in-out infinite alternate;
}

/* Right-side flag */
.side-flag {
  position: fixed;
  z-index: 5;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  writing-mode: vertical-rl;
  background: linear-gradient(180deg, #ff9ecb, #a7baff);
  color: #11132a;
  padding: 12px 7px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: 0 0 18px #a7baff35;
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: clamp(20px, 5vw, 32px);
  border: 1px solid #ffffff25;
  border-radius: 24px;
  background: rgba(20, 23, 45, .94);
  box-shadow: 0 0 45px #7863ff25;
  text-align: center;
}

.badge {
  display: inline-block;
  max-width: 100%;
  padding: 8px 12px;
  margin-bottom: 24px;
  border-radius: 30px;
  background: #ffffff0c;
  border: 1px solid #ffffff20;
  color: #b9c4ff;
  font-size: 10px;
  letter-spacing: 1.5px;
  overflow-wrap: anywhere;
}

.progress {
  height: 4px;
  background: #ffffff15;
  border-radius: 10px;
  margin-bottom: 25px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 16.66%;
  background: linear-gradient(90deg, #829dff, #ff88bb);
  transition: width .35s ease;
}

#content {
  animation: appear .4s ease;
}

#step {
  color: #aab3e8;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 14px;
}

.emoji {
  font-size: clamp(42px, 12vw, 62px);
  margin-bottom: 17px;
  animation: float 2.5s ease-in-out infinite;
}

h1 {
  font-size: clamp(26px, 7vw, 38px);
  line-height: 1.2;
  overflow-wrap: anywhere;
  margin-bottom: 16px;
  background: linear-gradient(90deg, #a7baff, #ff9ecb);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

p {
  color: #d0d3e9;
  font-size: clamp(14px, 3.8vw, 16px);
  line-height: 1.75;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 24px;
}

button {
  width: 100%;
  min-height: 46px;
  padding: 13px 16px;
  border: none;
  border-radius: 13px;
  font-size: 14px;
  line-height: 1.4;
  font-weight: bold;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: transform .2s ease;
}

button:hover {
  transform: translateY(-2px);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.next {
  color: #101329;
  background: linear-gradient(100deg, #a5b9ff, #ff9bc5);
}

.later {
  color: #dce0ff;
  background: #ffffff0c;
  border: 1px solid #ffffff20;
}

.footer {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #ffffff15;
  color: #9399c1;
  font-size: 11px;
  line-height: 1.6;
}

.final-note {
  margin-top: 18px;
  padding: 15px;
  border: 1px solid #ff9ecb40;
  border-radius: 14px;
  background: #ff9ecb0b;
  color: #ffbad4;
  font-size: 13px;
  line-height: 1.7;
}

@keyframes float {
  50% { transform: translateY(-6px); }
}

@keyframes sparkle {
  from { opacity: .2; }
  to { opacity: .5; }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 400px) {
  body {
    padding: 18px 28px 18px 12px;
    align-items: flex-start;
  }

  .card {
    padding: 20px 15px;
    border-radius: 19px;
  }

  .badge {
    font-size: 9px;
    letter-spacing: 1px;
  }

  p {
    line-height: 1.7;
  }

  .side-flag {
    right: 3px;
    font-size: 9px;
    padding: 10px 5px;
  }
}

@media (max-height: 650px) {
  body {
    align-items: flex-start;
  }
}
/* Top-right waving flag */
.side-flag {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 9999;
  writing-mode: horizontal-tb;
  padding: 9px 12px;
  border-radius: 10px;
  background: linear-gradient(135deg, #a7baff, #ff9ecb);
  color: #11132a;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: 0 4px 15px #a7baff55;
  transform-origin: top center;
  animation: flagWave 1.5s ease-in-out infinite alternate;
}

@keyframes flagWave {
  from { transform: rotate(-4deg); }
  to { transform: rotate(4deg); }
    }
</style>
</head>

<body>

<div class="stars"></div>

<div class="side-flag" aria-label="O-F-C Shant Hai">
  🏳️ O-F-C SHANZAY
</div>

<main class="card">

  <div class="badge">✦ A LITTLE MESSAGE FOR YOU ✦</div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="content"></div>

  <div class="footer">
    Made with courage, memories & friendship ❤️
  </div>

</main>

<script>
const pages = [
  {
    emoji: "🎮",
    title: "Hey, Shanzay! 👀",
    text: `There's something I wanted to tell you.

It's just a little message from me.

Will you hear me out?`,
    button: "Open My Message →",
    first: true
  },
  {
    emoji: "🎮",
    title: "Where It All Started",
    text: `Yaar Shanzay, remember Free Fire? 🥹

Gaming was one of the things that brought us together.

I still value those moments we shared in the game.`,
    button: "Next Page →"
  },
  {
    emoji: "💭",
    title: "Can I Say Something?",
    text: `Yaar, I know ke hamare darmiyan narazgi hai.

Main nahi chahta ke hum bas isi narazgi mein reh jaayein.

Isliye aaj dil se ek baat kehni hai.`,
    button: "Hear Me Out →"
  },
  {
    emoji: "❤️",
    title: "I'm Really Sorry",
    text: `Shanzay, agar meri kisi baat se tumhein bura laga, I'm genuinely sorry.

Mera maqsad tumhein hurt karna nahi tha.

Main apni taraf se baat theek karna chahta hoon.

I hope you can understand me. ❤️`,
    button: "One More Thing →"
  },
  {
    emoji: "🤝",
    title: "Can We Start Again?",
    text: `Chalo yaar, baaki sab narazgi chhor dete hain.

Hum araam se baat kar sakte hain aur cheezein theek karne ki koshish kar sakte hain.

Koi pressure nahi. Bas ek chance for a fresh start?`,
    button: "Next Page →"
  },
  {
    emoji: "🔥",
    title: "Ek Game Ho Jaye?",
    text: `Shanzay, jis Free Fire game se hum shuru hue thay...

Kya hum dobara saath game khel sakte hain? 🎮

Purani achhi vibes wapas laane ki koshish karte hain.

Agar tum ready ho, let's play again! ❤️`,
    button: "Final Message →"
  },
  {
    emoji: "🌙",
    title: "Thank You, Shanzay!",
    text: `Thank you for reading and giving this little message your time. ❤️

I hope we can leave the narazgi behind and talk again whenever you're ready.

No pressure, yaar. Take care!`,
    button: "Read Again ↻",
    final: true
  }
];

let page = 0;

function renderPage() {
  const item = pages[page];

  document.getElementById("bar").style.width =
    ((page + 1) / pages.length * 100) + "%";

  const content = document.getElementById("content");

  content.style.animation = "none";
  void content.offsetWidth;
  content.style.animation = "appear .4s ease";

  content.innerHTML = `
    <div id="step">PAGE ${String(page + 1).padStart(2, "0")} / ${pages.length}</div>

    <div class="emoji">${item.emoji}</div>

    <h1>${item.title}</h1>

    <p>${item.text}</p>

    ${item.final ? `
      <div class="final-note">
        ✨ You can close this page now.<br>
        Thank you for giving it your time.
      </div>
    ` : ""}

    <div class="buttons">
      <button class="next" id="nextButton">
        ${item.button}
      </button>

      ${!item.final ? `
        <button class="later" id="laterButton">
          Take Your Time
        </button>
      ` : ""}
    </div>
  `;

  document.getElementById("nextButton").addEventListener("click", () => {
    if (item.final) {
      page = 0;
    } else {
      page++;
    }
    renderPage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  const laterButton = document.getElementById("laterButton");

  if (laterButton) {
    laterButton.addEventListener("click", () => {
      alert("Koi pressure nahi, Shanzay. Jab dil kare, aage parh lena. ❤️");
    });
  }
}

renderPage();
</script>

</body>
</html>
